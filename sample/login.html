<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - MADD for Movies</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="madd.css">
</head>
<body style="background: url('background.jpg') no-repeat center center fixed; background-size: cover;">

<div class="container" style="margin-top: 50px;">
  <div class="row">
    <div class="col-sm-offset-4 col-sm-4" style="background-color: white; padding: 30px; border-radius: 10px; border: 2px solid black; box-shadow: 5px 10px 18px #000000;">
      
      <h2 class="text-center" style="font-weight: bold;">MADD FOR MOVIES?<br>LOGIN</h2>
      <br>

      <form action="login_handler.php" method="POST">
        <div class="form-group">
          <label for="username">USERNAME</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username here" required>
        </div>

        <div class="form-group">
          <label for="pwd">PASSWORD</label>
          <input type="password" class="form-control" id="pwd" name="password" placeholder="Enter your password here" required>
        </div>

        <button type="submit" class="btn btn-default btn-block" style="border: 1px solid black; font-weight: bold;">SIGN IN</button>
        
        <p id="response" class="text-danger"></p>
        
        <div class="text-center" style="margin: 20px 0;">
          <hr style="border-top: 1px solid black; display: inline-block; width: 40%; vertical-align: middle;">
          <span style="vertical-align: middle;"> OR </span>
          <hr style="border-top: 1px solid black; display: inline-block; width: 40%; vertical-align: middle;">
        </div>

        <div class="text-center">
            Don't have an account? <a href="registration.html" style="font-weight: bold; text-decoration: underline;">Sign Up</a>
        </div>
      </form>

    </div>
  </div>
</div>

</body>
</html>
