<!DOCTYPE html>
<html lang="en">
<head>
  <title>Register - MADD FOR MOVIES</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="madd.css">
</head>
<body style="background: url('background.jpg') no-repeat center center fixed; background-size: cover;">

<div class="container" style="margin-top: 30px;">
  <div class="row">
    <div class="col-sm-offset-4 col-sm-4" style="background-color: white; padding: 25px; border-radius: 10px; border: 2px solid black; box-shadow: 5px 10px 18px #000;">
      
      <h2 class="text-center" style="font-weight: bold;">MADD FOR MOVIES?<br>REGISTER</h2>
      
      <form action="registration_handler.php" method="POST" id="registration-form">
        
        <div class="form-group">
          <label for="username">USERNAME</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
          <label for="email">EMAIL</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Choose a email" required>
        </div>

        <div class="form-group">
          <label for="password">CREATE PASSWORD</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 4 characters" required minlength="4">
        </div>

        <div class="form-group">
          <label for="confirm-password">CONFIRM PASSWORD</label>
          <input type="password" class="form-control" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="btn btn-default btn-block" style="border: 1px solid black; font-weight: bold;">CREATE ACCOUNT</button>
        
        <p id="response" class="text-danger"></p>
        
        <div class="text-center" style="margin: 15px 0;">
          <hr style="border-top: 1px solid black; display: inline-block; width: 40%; vertical-align: middle;">
          <span style="vertical-align: middle;"> OR </span>
          <hr style="border-top: 1px solid black; display: inline-block; width: 40%; vertical-align: middle;">
        </div>

        <div class="text-center">
            Already have an account? <a href="login.html" style="font-weight: bold; text-decoration: underline;">Sign In</a>
        </div>
      </form>

    </div>
  </div>
</div>

<script>
    var response = sessionStorage.getItem("message");
    if (response) {
        var p_ele = document.getElementById("response");
        p_ele.textContent = response;
        sessionStorage.removeItem("message");     
    }
</script>

</body>
</html>
