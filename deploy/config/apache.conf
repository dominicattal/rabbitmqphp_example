<VirtualHost *:80>
    ServerName madd.local
    #DocumentRoot /home/YOUR_USER/rabbitmqphp_example/sample
    DocumentRoot /var/www/madd/sample

    #<Directory /home/YOUR_USER/rabbitmqphp_example/sample>
    <Directory /var/www/madd/sample>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/madd_error.log
    CustomLog ${APACHE_LOG_DIR}/madd_access.log combined
</VirtualHost>


