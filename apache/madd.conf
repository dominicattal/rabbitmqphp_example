<VirtualHost *:80>
    ServerName madd.local
    ServerAlias www.madd.local

    DocumentRoot /home/YOUR_PATH/rabbitmqphp_example/sample

    <Directory /home/YOUR_PATH/rabbitmqphp_example/sample>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/madd_error.log
    CustomLog ${APACHE_LOG_DIR}/madd_access.log combined
</VirtualHost>
